services:
  postgres:
    image: postgres:16-alpine
    container_name: pia-do-sul-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: pia_do_sul
      POSTGRES_PASSWORD: pia_do_sul
      POSTGRES_DB: pia_do_sul
    ports:
      # 5433 (não 5432) para não colidir com um PostgreSQL local já instalado na máquina de dev.
      - "5433:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data

volumes:
  postgres-data:
